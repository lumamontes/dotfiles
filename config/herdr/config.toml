onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Keep the prefix bindings as a discoverable fallback. These direct chords are
# deliberately in the Ctrl+Alt family because macOS terminals usually pass it
# through without stealing it from the pane application.
indexed.tabs = "ctrl+alt"
indexed.workspaces = "ctrl+alt+shift"
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

[ui]
sidebar_width = 42
sidebar_max_width = 56
mouse_capture = false
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
window_title = "{hostname}: {workspace} / {tab} / {pane} / {terminal_title}"

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent"],
  ["workspace", "tab", "pane"],
  ["terminal_title_stripped"],
  ["$summary"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"
# Avoid interrupting focus for a transient state change.
delay_seconds = 5

[ui.sound]
enabled = true

[ui.sound.agents]
claude = "on"
open_code = "on"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"
